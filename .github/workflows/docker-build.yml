name: docker-build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build binary inference image
        run: docker build --tag financial-triage .
      - name: Verify inference-only contents
        run: |
          docker run --rm --entrypoint python financial-triage -c '
          from pathlib import Path
          import importlib.util
          files = {str(p) for p in Path("/app").rglob("*") if p.is_file()}
          assert files == {"/app/app.py", "/app/pyproject.toml", "/app/uv.lock",
                           "/app/decision_models/serving/model.joblib", "/app/decision_models/serving/manifest.json"}, files
          assert importlib.util.find_spec("torch") is None
          assert importlib.util.find_spec("openai") is None
          '
      - name: Verify container inference
        run: |
          docker run --detach --name triage --publish 127.0.0.1:8000:8000 financial-triage
          python - <<'PY'
          import json, math, time
          from urllib.error import URLError
          from urllib.request import Request, urlopen
          for attempt in range(30):
              try:
                  with urlopen("http://127.0.0.1:8000/health", timeout=2) as response:
                      health = json.load(response)
                  break
              except URLError:
                  if attempt == 29:
                      raise
                  time.sleep(1)
          assert health == {"status": "ok", "model": "tfidf-logistic-n4000", "policy": "calibration_miss_1pct"}, health
          request = Request("http://127.0.0.1:8000/predict", method="POST",
                            data=json.dumps({"body": "The company entered a definitive merger agreement."}).encode(),
                            headers={"Content-Type": "application/json"})
          with urlopen(request, timeout=10) as response:
              result = json.load(response)
          assert result["label"] in {"routine", "review_worthy"}, result
          assert result["action"] in {"review", "skip"}, result
          assert set(result["probabilities"]) == {"routine", "review_worthy"}, result
          assert all(math.isfinite(p) and 0 <= p <= 1 for p in result["probabilities"].values()), result
          assert math.isclose(sum(result["probabilities"].values()), 1), result
          print(json.dumps(result))
          PY
      - name: Container logs
        if: failure()
        run: docker logs triage || true
